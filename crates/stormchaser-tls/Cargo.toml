[package]
publish = true
name = "stormchaser-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "stormchaser_tls"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"
rustls-native-certs = "0.8"
notify = "8.2"
arc-swap = "1.7"
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
axum = { workspace = true, optional = true }
hyper = { version = "1", features = ["http1", "http2", "server"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tower = { workspace = true, optional = true }

[features]
# An HTTP(S) listener for axum services
listener = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio-rustls", "dep:tower"]

[dev-dependencies]
tempfile = "3.10"
