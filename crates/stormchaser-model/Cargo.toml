[package]
publish = true
name = "stormchaser-model"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { version = "1.0", features = ["v4", "js", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["uuid", "chrono", "json", "macros", "migrate"] }
getrandom = { version = "0.2", features = ["js"] }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = ["uuid", "chrono"] }
hcl-rs.workspace = true
regex.workspace = true
cloudevents-sdk = "0.9.0"
jsonschema.workspace = true
nutype = { version = "0.7.0", features = ["serde", "schemars08"] }
crc32fast = "1.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
opa-wasm = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
tokio-tungstenite = "0.29.0"
tokio-stream = "0.1.18"
async-nats = { workspace = true }
oci-distribution = { version = "0.11.0", default-features = false, features = ["rustls-tls"] }
tar = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest-retry = { workspace = true }
tungstenite = "0.29.0"
futures = { workspace = true }

[dev-dependencies]
testcontainers = "0.23"
wiremock = "0.6.5"
