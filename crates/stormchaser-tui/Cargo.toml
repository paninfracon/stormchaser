[package]
publish = false
name = "stormchaser-tui"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.36", features = ["full"] }
reqwest = { workspace = true, features = ["cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["serde", "v4"] }
eventsource-stream = "0.2"
futures = "0.3"
tokio-stream = "0.1"
stormchaser-model = { version = "0.1.0", path = "../stormchaser-model" }
clap = { version = "4.4", features = ["derive", "env"] }
urlencoding = "2.1"
open = "5.3.4"
url = "2.5.8"
serde_urlencoded = "0.7.1"
humantime = "2.1"
ratatui-textarea = "0.9.1"
ratatui-form = { path = "../../.tmp/ratatui-form" }
stormchaser-dsl = { version = "0.1.0", path = "../stormchaser-dsl" }
tui-file-explorer = "0.1.3"

[dev-dependencies]
insta = { version = "1.34", features = ["json"] }
ratatui = { version = "0.30" }
wiremock = "0.6.5"
