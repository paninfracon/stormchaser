[package]
name = "stormchaser-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.36", features = ["full"] }
reqwest = { workspace = true, features = ["cookies"] }
serde_json = { workspace = true }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["serde", "v4"] }
futures = "0.3"
stormchaser-model = { version = "1.5.1", path = "../stormchaser-model" }
stormchaser-client = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
open = "5.3.4"
humantime = "2.1"
ratatui-textarea = "0.9.1"
stormchaser-dsl = { version = "1.5.1", path = "../stormchaser-dsl" }
tui-file-explorer = { version = "3.0", default-features = false }
jsonschema = { workspace = true }

[dev-dependencies]
insta = { version = "1.34", features = ["json"] }
ratatui = { version = "0.30" }
wiremock = "0.6.5"
