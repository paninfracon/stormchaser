[package]
name = "stormchaser-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stormchaser query and hydration engine microservice"
repository.workspace = true
license.workspace = true

[[bin]]
name = "stormchaser-query"
path = "src/main.rs"

[features]
default = ["aws-cloudcontrol"]
aws-cloudcontrol = ["stormchaser-core/aws-cloudcontrol"]

[dependencies]
stormchaser-model = { workspace = true }
stormchaser-dsl = { workspace = true }
stormchaser-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
jsonschema = { workspace = true }
hcl-rs = { workspace = true }
axum = { workspace = true }
tokio-stream = "0.1.18"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
stormchaser-tls = { version = "1.5.1", path = "../stormchaser-tls" }
stormchaser-opa = { version = "1.5.1", path = "../stormchaser-opa" }
async-nats.workspace = true

[dev-dependencies]
tower = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
git2 = { version = "0.21", features = ["vendored-openssl", "https", "ssh"] }
tempfile = "3.27.0"
wiremock = "0.6"
