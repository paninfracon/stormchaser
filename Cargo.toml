[workspace]
resolver = "2"
members = [
    "crates/stormchaser-api",
    "crates/stormchaser-cli",
    "crates/stormchaser-dsl",
    "crates/stormchaser-engine",
    "crates/stormchaser-model",
    "crates/stormchaser-runner-k8s",
    "crates/stormchaser-runner-docker",
    "crates/stormchaser-agent",
    "crates/stormchaser-tls",
    "crates/stormchaser-opa",
    "crates/stormchaser-tui", "crates/stormchaser-query", "crates/stormchaser-web",
]

[workspace.package]
version = "1.5.1"
authors = ["Stormchaser Core Team"]
description = "A robust, distributed workflow engine for event-driven and human-triggered workflows."
repository = "https://github.com/paninfracon/stormchaser"
license = "MIT OR Apache-2.0 OR CDLA-Permissive-2.0"
edition = "2021"
rust-version = "1.96"

[workspace.dependencies]
stormchaser-model = { version = "1.5.1", path = "crates/stormchaser-model" }
stormchaser-dsl = { version = "1.5.1", path = "crates/stormchaser-dsl" }
stormchaser-tls = { version = "1.5.1", path = "crates/stormchaser-tls" }

tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-nats = "0.50"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
tower-http = { version = "0.7", features = ["trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "form"] }
reqwest-middleware = { version = "0.5", features = ["json", "query", "form"] }
reqwest-retry = "0.9"
url = "2"
tower = { version = "0.5", features = ["util"] }
once_cell = "1.20"
parking_lot = "0.12"
dashmap = "6.1"
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
hcl-rs = { version = "0.19.7" }
wasmtime = "49.0.3"
# All builtin groups except `yaml-builtins`, which depends on the deprecated serde_yaml
# (and the unmaintained unsafe-libyaml, RUSTSEC-2024-0449).
opa-wasm = { version = "0.3.3", default-features = false, features = [
    "fast",
    "all-crypto-builtins",
    "base64url-builtins",
    "hex-builtins",
    "json-builtins",
    "rand-builtins",
    "semver-builtins",
    "sprintf-builtins",
    "units-builtins",
    "urlquery-builtins",
    "time-builtins",
] }
regex = "1.12.3"
base64 = "0.23"
aes-gcm = "0.11"
aead = "0.6"
vaultrs = "0.8"
aws-config = "1"
# The AWS SDK crates' default `rustls` feature pulls in the legacy hyper 0.14 client
# (and with it h2 0.3); only the current `default-https-client` is enabled.
aws-sdk-s3 = { version = "1.65", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-ses = { version = "1.61", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.63", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.63", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
minijinja = { version = "3.0", features = ["json", "serde", "fuel"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = "0.33"
tracing-opentelemetry = "0.34"
opentelemetry-semantic-conventions = "0.33"
vergen-gitcl = { version = "10.0", features = ["build", "cargo", "rustc", "si"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
jaq-core = "3.1"
jaq-json = { version = "2.0", features = ["serde"] }
jaq-std = "3.0"
rustls = { version = "0.23.46", features = ["ring"] }
quick-xml = { version = "0.42", features = ["serialize"] }
tar = "0.4"
flate2 = "1.0"
jsonschema = { version = "0.58", default-features = false }
