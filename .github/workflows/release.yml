name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-linux-binaries:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgit2-dev zlib1g-dev musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build Workspace
        run: |

          SQLX_OFFLINE=true cargo build --release --workspace
          SQLX_OFFLINE=true cargo build --release -p stormchaser-agent --target x86_64-unknown-linux-musl

          # Replace agent with musl version for Dockerfile.prebuilt
          cp target/x86_64-unknown-linux-musl/release/stormchaser-agent target/release/stormchaser-agent

      - name: Package Linux Binaries
        run: |
          mkdir -p dist
          for BIN in stormchaser-api stormchaser-engine stormchaser-runner-k8s stormchaser-runner-docker stormchaser-agent stormchaser stormchaser-tui; do
            if [ -f "target/release/$BIN" ]; then
              tar -czvf dist/$BIN-x86_64-unknown-linux-gnu.tar.gz -C target/release $BIN
            fi
          done

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Upload Binaries as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: target/release/stormchaser*
          retention-days: 1
          if-no-files-found: error

  build-docker-images:
    name: Build Docker Images
    needs: build-linux-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: stormchaser-api
          - image: stormchaser-engine
          - image: stormchaser-runner-k8s
          - image: stormchaser-runner-docker
          - image: stormchaser-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Binaries Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: target/release

      - name: Make Binaries Executable
        run: chmod +x target/release/stormchaser-*

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prebuilt
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=${{ matrix.image }}

  build-mac-windows-cli:
    name: Build CLI for macOS/Windows
    needs: build-linux-binaries
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}



      - name: Build and Upload CLI
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stormchaser
          target: ${{ matrix.target }}
          archive: stormchaser-${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SQLX_OFFLINE: true

  publish-crates:
    name: Publish to Crates.io
    needs: build-linux-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish foundational crates first
          cargo publish -p stormchaser-model
          sleep 15
          cargo publish -p stormchaser-opa
          sleep 15
          cargo publish -p stormchaser-tls
          sleep 15
          cargo publish -p stormchaser-dsl
          sleep 15

          # Publish dependent crates
          cargo publish -p stormchaser-engine
          sleep 15
          cargo publish -p stormchaser-api
          sleep 15
          cargo publish -p stormchaser-runner-docker
          sleep 15
          cargo publish -p stormchaser-runner-k8s
          sleep 15
          cargo publish -p stormchaser-agent
          sleep 15

          # Publish top-level CLI
          cargo publish -p stormchaser-cli
