name: CI

on:
  # Every branch, so long-lived branches are checked before they reach a pull request
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "trunk" ]
  # Nightly, so a new advisory or a dependency release that breaks the build shows up
  # the next morning: Cargo.lock is not committed, and cargo-deny fetches a fresh
  # advisory database on every run
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: rustfmt

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

  deny:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Install cargo-deny
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: cargo-deny@0.19.4
    # Cargo.lock is not committed, so this resolves the versions a build would get now
    - name: Check advisories, bans, licenses and sources
      run: cargo deny check

  charts:
    name: Check Helm Charts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # The runner image ships Helm
    - name: Lint, render and check the vendored subchart archives
      run: ./scripts/check-charts.sh

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Maximize Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
    - name: Create Swap File
      run: |
        sudo fallocate -l 2G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=2048
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: clippy

    - name: Generate Certificates
      run: ./scripts/generate-certs.sh
    - name: Cache dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    # The engine's optional integrations are cfg-gated; build it without them too.
    - name: Run cargo clippy (engine, no default features)
      run: cargo clippy -p stormchaser-engine --all-targets --no-default-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      STORMCHASER_CERT_DIR: ./tests/certs
      API_RATE_LIMIT_BURST_SIZE: 1000
      API_RATE_LIMIT_PER_SECOND: 1000
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Maximize Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
    - name: Create Swap File
      run: |
        sudo fallocate -l 2G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=2048
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: clippy
        targets: wasm32-unknown-unknown

    - name: Cache dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Install sqlx-cli and cargo-leptos
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: sqlx-cli,cargo-leptos
    - name: Generate Dev Passwords
      run: |
        STORMCHASER_DEV_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(16))')
        STORMCHASER_MINIO_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(16))')
        STORMCHASER_CLI_SECRET="stormchaser-cli-secret"
        # NATS reads its passwords as unquoted config values: one starting with '-' or
        # looking like a number stops the server, so these start with a letter
        STORMCHASER_NATS_PASSWORD=$(python3 -c 'import secrets; print("n" + secrets.token_hex(16))')
        STORMCHASER_NATS_RUNNER_PASSWORD=$(python3 -c 'import secrets; print("n" + secrets.token_hex(16))')
        STORMCHASER_NATS_API_PASSWORD=$(python3 -c 'import secrets; print("n" + secrets.token_hex(16))')
        STORMCHASER_NATS_QUERY_PASSWORD=$(python3 -c 'import secrets; print("n" + secrets.token_hex(16))')
        STORMCHASER_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
        # docker compose refuses to start without it. Only compose reads it: the tests sign
        # with the debug key, so it stays out of $GITHUB_ENV.
        echo "STORMCHASER_JWT_SECRET=$STORMCHASER_JWT_SECRET" >> .env
        echo "STORMCHASER_NATS_PASSWORD=$STORMCHASER_NATS_PASSWORD" >> .env
        echo "STORMCHASER_NATS_RUNNER_PASSWORD=$STORMCHASER_NATS_RUNNER_PASSWORD" >> .env
        echo "STORMCHASER_NATS_PASSWORD=$STORMCHASER_NATS_PASSWORD" >> $GITHUB_ENV
        echo "STORMCHASER_NATS_RUNNER_PASSWORD=$STORMCHASER_NATS_RUNNER_PASSWORD" >> $GITHUB_ENV
        echo "STORMCHASER_NATS_API_PASSWORD=$STORMCHASER_NATS_API_PASSWORD" >> .env
        echo "STORMCHASER_NATS_API_PASSWORD=$STORMCHASER_NATS_API_PASSWORD" >> $GITHUB_ENV
        echo "STORMCHASER_NATS_QUERY_PASSWORD=$STORMCHASER_NATS_QUERY_PASSWORD" >> .env
        echo "STORMCHASER_NATS_QUERY_PASSWORD=$STORMCHASER_NATS_QUERY_PASSWORD" >> $GITHUB_ENV
        echo "STORMCHASER_DEV_PASSWORD=$STORMCHASER_DEV_PASSWORD" >> .env
        echo "STORMCHASER_MINIO_PASSWORD=$STORMCHASER_MINIO_PASSWORD" >> .env
        echo "STORMCHASER_CLI_SECRET=$STORMCHASER_CLI_SECRET" >> .env
        echo "STORMCHASER_DEV_PASSWORD=$STORMCHASER_DEV_PASSWORD" >> $GITHUB_ENV
        echo "STORMCHASER_MINIO_PASSWORD=$STORMCHASER_MINIO_PASSWORD" >> $GITHUB_ENV
        echo "STORMCHASER_CLI_SECRET=$STORMCHASER_CLI_SECRET" >> $GITHUB_ENV
    - name: Generate Certificates
      run: ./scripts/generate-certs.sh
    - name: Install Playwright Dependencies
      run: |
        cd crates/stormchaser-web/e2e
        npm ci
        npx playwright install --with-deps
    - name: Run Unit Tests
      run: STORMCHASER_UNIT_TEST_WITH_ENV=1 ./scripts/test-unit.sh --all-features
    - name: Run Integration Tests
      run: ./scripts/test-integration.sh --all-features
