services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stormchaser
      POSTGRES_PASSWORD: ${STORMCHASER_DEV_PASSWORD:-stormchaser_dev_password}
      POSTGRES_DB: stormchaser
    ports:
      - "${PORT_DB:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stormchaser"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10
    ports:
      - "${PORT_NATS:-4222}:4222"
      - "${PORT_NATS_MGT:-8222}:8222"
    command: ["-js"] # Enable JetStream if needed

  dex:
    image: dexidp/dex:v2.41.1
    volumes:
      - ./deploy/dex/config.generated.yaml:/etc/dex/config.docker.yaml:ro
    ports:
      - "${PORT_DEX:-5556}:5556"
    command: dex serve /etc/dex/config.docker.yaml
    depends_on:
      postgres:
        condition: service_healthy

  loki:
    image: grafana/loki:3.0.0
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "${PORT_LOKI:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # tempo
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${PORT_GRAFANA:-3002}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki
      - prometheus

  alloy:
    image: grafana/alloy:latest
    profiles: ["docker", "k8s"]
    user: root
    environment:
      - LOKI_URL=http://loki:3100
      - PROMETHEUS_URL=http://prometheus:9090
      - TEMPO_URL=tempo:4317
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki

  s3:
    image: minio/minio:latest
    ports:
      - "${PORT_S3:-9000}:9000"
      - "${PORT_S3_CONS:-9001}:9001"
    environment:
      MINIO_ROOT_USER: stormchaser
      MINIO_ROOT_PASSWORD: ${STORMCHASER_MINIO_PASSWORD:-stormchaser_dev_password}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2
    ports:
      - "${PORT_REG:-32000}:5000"
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "${PORT_OPA:-8181}:8181"
    volumes:
      - ./deploy/opa:/etc/opa
    command: run --server --addr 0.0.0.0:8181 --log-level debug /etc/opa/policy.rego

  orchestration-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: stormchaser-engine
    environment:
      DATABASE_URL: 'postgres://stormchaser:${STORMCHASER_DEV_PASSWORD?Error: STORMCHASER_DEV_PASSWORD is not set}@postgres:5432/stormchaser'
      NATS_URL: nats://nats:4222
      RUST_LOG: stormchaser_engine=debug
      GIT_CACHE_DIR: /tmp/stormchaser/git-cache
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: stormchaser-engine
      OPA_URL: http://opa:8181/v1/data/stormchaser/allow
      AWS_ACCESS_KEY_ID: stormchaser
      AWS_SECRET_ACCESS_KEY: ${STORMCHASER_MINIO_PASSWORD:-stormchaser_dev_password}
      AWS_DEFAULT_REGION: us-east-1
      S3_INTERNAL_URL: http://s3:9000
      TLS_CA_CERT_PATH: /etc/engine/certs/ca.crt
      TLS_CERT_PATH: /etc/engine/certs/tls.crt
      TLS_KEY_PATH: /etc/engine/certs/tls.key
    volumes:
      - git-cache:/tmp/stormchaser/git-cache
      - ${STORMCHASER_CERT_DIR:-./tests/certs}:/etc/engine/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      opa:
        condition: service_started

  orchestration-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: stormchaser-api
    environment:
      DATABASE_URL: 'postgres://stormchaser:${STORMCHASER_DEV_PASSWORD?Error: STORMCHASER_DEV_PASSWORD is not set}@postgres:5432/stormchaser'
      NATS_URL: nats://nats:4222
      RUST_LOG: stormchaser_api=debug
      OIDC_ISSUER: http://dex:5556/dex
      OIDC_EXTERNAL_ISSUER: http://localhost:5556/dex
      OIDC_CLIENT_ID: stormchaser-cli
      OIDC_CLIENT_SECRET: stormchaser-cli-secret
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: stormchaser-api
      OPA_URL: http://opa:8181/v1/data/stormchaser/allow
      API_RATE_LIMIT_PER_SECOND: 10000
      API_RATE_LIMIT_BURST_SIZE: 100000
      TLS_CA_CERT_PATH: /etc/engine/certs/ca.crt
      TLS_CERT_PATH: /etc/engine/certs/tls.crt
      TLS_KEY_PATH: /etc/engine/certs/tls.key
    volumes:
      - ${STORMCHASER_CERT_DIR:-./tests/certs}:/etc/engine/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      dex:
        condition: service_started
      opa:
        condition: service_started
    ports:
      - "${PORT_API:-3000}:3000"

  docker-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: stormchaser-runner-docker
    profiles: ["docker"]
    environment:
      NATS_URL: nats://nats:4222
      RUST_LOG: stormchaser_runner_docker=debug
      STORMCHASER_STATE_ENCRYPTION_KEY: "01234567890123456789012345678901"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nats

  k8s-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: stormchaser-runner-k8s
    image: stormchaser-runner-k8s:v1
    profiles: [build-only]

  stormchaser-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: stormchaser-agent
    image: stormchaser-agent:v1
    profiles: [build-only]

volumes:
  git-cache:
  postgres-data:
ta:
it-cache:
  postgres-data:
