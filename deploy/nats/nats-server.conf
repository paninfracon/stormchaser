# NATS server configuration for the Stormchaser quickstart (docker-compose).
#
# One user per role, each limited to what that role does:
#   stormchaser         The engine. Unrestricted: it owns the stream and is the only
#                       thing that may hand tasks to runners.
#   stormchaser-api     The API. May queue runs, report the outcome of approvals and
#                       waits, watch run events, and keep its rate-limit buckets. It
#                       cannot publish a task or read one.
#   stormchaser-query   The query service. Connects, and may do nothing else.
#   stormchaser-runner  Docker and Kubernetes runners. May only report on steps,
#                       register itself, and consume its own task subjects.
#
# The API and the query service face users. Kept apart from the engine's user, a
# compromise of either cannot schedule containers on runners behind the engine's
# policy check, or read the resolved secrets that task messages carry.
#
# Passwords come from the environment. See docs/nats.md for what a production
# server needs on top of this (TLS, clustering, network isolation).

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    {
      user: stormchaser
      password: $NATS_CONTROL_PASSWORD
    }
    {
      user: stormchaser-api
      password: $NATS_API_PASSWORD
      permissions {
        publish {
          allow: [
            # Runs to start
            "stormchaser.v1.*.run.queued"
            "stormchaser.v1.run.direct"
            # The outcome of an approval or a wait, which the engine accepts only
            # with the step's completion token
            "stormchaser.v1.*.step.completed"
            "stormchaser.v1.*.step.failed"
            # The rate limiter's key-value bucket. The client reads the account's
            # JetStream limits before it creates the bucket.
            "$JS.API.INFO"
            "$JS.API.STREAM.CREATE.KV_api_rate_limit_buckets"
            "$JS.API.STREAM.INFO.KV_api_rate_limit_buckets"
            "$JS.API.DIRECT.GET.KV_api_rate_limit_buckets.>"
            "$JS.API.STREAM.MSG.GET.KV_api_rate_limit_buckets"
            "$KV.api_rate_limit_buckets.>"
          ]
        }
        subscribe {
          allow: [
            # Publish acknowledgements and request replies. Each user has an inbox
            # prefix of its own (_INBOX_<user>, see stormchaser_model::nats::inbox_prefix)
            # and may read only that: on the shared _INBOX.> any user could read the
            # engine's deliveries and the answers the engine sends to others.
            "_INBOX_stormchaser-api.>"
            # Run events, for the runs stream
            "stormchaser.v1.run.>"
            "stormchaser.v1.*.run.>"
          ]
        }
      }
    }
    {
      user: stormchaser-query
      password: $NATS_QUERY_PASSWORD
      permissions {
        publish {
          deny: [">"]
        }
        subscribe {
          allow: ["_INBOX_stormchaser-query.>"]
        }
      }
    }
    {
      user: stormchaser-runner
      password: $NATS_RUNNER_PASSWORD
      permissions {
        publish {
          allow: [
            # Runner lifecycle
            "stormchaser.v1.runner.register"
            "stormchaser.v1.global.runner.heartbeat"
            "stormchaser.v1.global.runner.offline"
            # Step status reports
            "stormchaser.v1.*.step.initializing"
            "stormchaser.v1.*.step.running"
            "stormchaser.v1.*.step.completed"
            "stormchaser.v1.*.step.failed"
            "stormchaser.v1.step.unpacking_sfs"
            "stormchaser.v1.step.packing_sfs"
            # Requests to the engine, outside the stream: ask whether a step is still
            # wanted, for a short-lived registry token to push a step's artifacts, and
            # for this runner's own key, which it signs its reports with
            "stormchaser.rpc.step.query"
            "stormchaser.rpc.step.artifact_auth"
            "stormchaser.rpc.runner.session"
            # JetStream: look up (or first-create) the stream, and create consumers
            # only on task subjects. The filter is part of the request subject.
            "$JS.API.STREAM.INFO.stormchaser"
            "$JS.API.STREAM.CREATE.stormchaser"
            "$JS.API.CONSUMER.INFO.stormchaser.*"
            "$JS.API.CONSUMER.CREATE.stormchaser.*.stormchaser.v1.*.step.scheduled.>"
            "$JS.API.CONSUMER.CREATE.stormchaser.*.stormchaser.v1.runner.>"
            "$JS.API.CONSUMER.MSG.NEXT.stormchaser.*"
            "$JS.ACK.stormchaser.>"
          ]
          # Never the engine's own consumers: pulling or acking there would steal
          # or drop control-plane events, and creating one again with another filter
          # would change what the engine receives. Add one shard entry per engine shard.
          deny: [
            "$JS.API.CONSUMER.CREATE.stormchaser.orchestration-engine-global.>"
            "$JS.API.CONSUMER.CREATE.stormchaser.orchestration-engine-legacy-run.>"
            "$JS.API.CONSUMER.CREATE.stormchaser.orchestration-engine-legacy-runner.>"
            "$JS.API.CONSUMER.CREATE.stormchaser.orchestration-engine-legacy-step.>"
            "$JS.API.CONSUMER.CREATE.stormchaser.orchestration-engine-shard-0.>"
            "$JS.API.CONSUMER.MSG.NEXT.stormchaser.orchestration-engine-global"
            "$JS.API.CONSUMER.MSG.NEXT.stormchaser.orchestration-engine-legacy-run"
            "$JS.API.CONSUMER.MSG.NEXT.stormchaser.orchestration-engine-legacy-runner"
            "$JS.API.CONSUMER.MSG.NEXT.stormchaser.orchestration-engine-legacy-step"
            "$JS.API.CONSUMER.MSG.NEXT.stormchaser.orchestration-engine-shard-0"
            "$JS.ACK.stormchaser.orchestration-engine-global.>"
            "$JS.ACK.stormchaser.orchestration-engine-legacy-run.>"
            "$JS.ACK.stormchaser.orchestration-engine-legacy-runner.>"
            "$JS.ACK.stormchaser.orchestration-engine-legacy-step.>"
            "$JS.ACK.stormchaser.orchestration-engine-shard-0.>"
          ]
        }
        # Pull-consumer deliveries and request replies arrive on the inbox.
        subscribe {
          allow: ["_INBOX_stormchaser-runner.>"]
        }
      }
    }
  ]
}
