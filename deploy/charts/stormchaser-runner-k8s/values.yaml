# Default values for stormchaser-runner-k8s.

replicaCount: 1

image:
  repository: stormchaser-runner-k8s
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Runner Configuration
config:
  natsUrl: "nats://172.17.0.1:4222"
  runnerId: "" # If empty, a UUID will be generated on startup
  rustLog: "stormchaser_runner_k8s=info"
  # Permit steps that set `privileged = true`. Such a step is root on the node.
  allowPrivileged: false
  # Cluster objects a RunK8sJob step may attach to its pod. Empty lists permit none.
  # An entry ending in `*` matches any name with that prefix.
  allowedServiceAccounts: []
  allowedSecretMounts: []
  allowedConfigMapMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

rbac:
  create: true
  # Namespace workflow step Jobs run in. Defaults to "<release namespace>-steps".
  # It must differ from the release namespace: steps run workflow authors' images and
  # may not share a namespace with the runner or the control plane. The runner
  # refuses to start otherwise.
  targetNamespace: ""
  # Create that namespace as part of this release. Set to false if it already exists.
  createTargetNamespace: true

global:
  agent:
    image:
      repository: stormchaser-agent
      tag: latest
      pullPolicy: Never
