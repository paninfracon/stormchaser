apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stormchaser-runner-k8s.fullname" . }}
  labels:
    {{- include "stormchaser-runner-k8s.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stormchaser-runner-k8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "stormchaser-runner-k8s.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stormchaser-runner-k8s.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ .Values.config.natsUrl | quote }}
            {{- with .Values.config.natsAuthSecret }}
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.config.runnerId }}
            - name: RUNNER_ID
              value: {{ .Values.config.runnerId | quote }}
            {{- end }}
            {{- with .Values.config.stateEncryptionSecret }}
            - name: STORMCHASER_STATE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.config.stateEncryptionSecretKey }}
            {{- end }}
            - name: STORMCHASER_STEP_DEFAULT_CPU
              value: {{ .Values.config.stepLimits.defaultCpu | quote }}
            - name: STORMCHASER_STEP_DEFAULT_MEMORY
              value: {{ .Values.config.stepLimits.defaultMemory | quote }}
            - name: STORMCHASER_STEP_MAX_CPU
              value: {{ .Values.config.stepLimits.maxCpu | quote }}
            - name: STORMCHASER_STEP_MAX_MEMORY
              value: {{ .Values.config.stepLimits.maxMemory | quote }}
            - name: STORMCHASER_STEP_DEFAULT_TIMEOUT
              value: {{ .Values.config.stepLimits.defaultTimeout | quote }}
            - name: STORMCHASER_STEP_MAX_TIMEOUT
              value: {{ .Values.config.stepLimits.maxTimeout | quote }}
            - name: STORMCHASER_STEP_MAX_PARALLELISM
              value: {{ .Values.config.stepLimits.maxParallelism | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: STORMCHASER_STEP_NAMESPACE
              value: {{ include "stormchaser-runner-k8s.stepNamespace" . | quote }}
            - name: STORMCHASER_ALLOWED_SERVICE_ACCOUNTS
              value: {{ join "," .Values.config.allowedServiceAccounts | quote }}
            - name: STORMCHASER_ALLOWED_SECRET_MOUNTS
              value: {{ join "," .Values.config.allowedSecretMounts | quote }}
            - name: STORMCHASER_ALLOWED_CONFIG_MAP_MOUNTS
              value: {{ join "," .Values.config.allowedConfigMapMounts | quote }}
            - name: STORMCHASER_ALLOW_PRIVILEGED
              value: {{ .Values.config.allowPrivileged | quote }}
            - name: STORMCHASER_AGENT_IMAGE
              value: "{{ .Values.global.agent.image.repository }}:{{ .Values.global.agent.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
