{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stormchaser-runner-k8s.fullname" . }}-job-manager
  labels:
    {{- include "stormchaser-runner-k8s.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stormchaser-runner-k8s.fullname" . }}-job-manager
  labels:
    {{- include "stormchaser-runner-k8s.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stormchaser-runner-k8s.fullname" . }}-job-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "stormchaser-runner-k8s.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
