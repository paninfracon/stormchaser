apiVersion: v2
name: stormchaser-orchestration
description: Helm chart for Stormchaser Orchestration Backplane (API and Engine)
type: application
version: 0.1.1
appVersion: "0.1.0"
dependencies:
  - name: prometheus
    version: "25.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "7.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
