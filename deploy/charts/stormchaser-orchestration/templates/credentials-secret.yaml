{{- /*
Credentials given to the chart as values, rather than as Secrets of their own, are kept
here so that they are not written into the pod specs, where anyone who may read a
Deployment or Pod would see them.
*/ -}}
{{- $db := not .Values.global.database.existingSecret -}}
{{- $oidc := and (not .Values.global.oidc.existingSecret) .Values.global.oidc.clientSecret -}}
{{- if or $db $oidc }}
{{- if $db }}
{{- include "stormchaser-orchestration.checkDatabaseUrl" . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stormchaser-orchestration.credentialsSecret" . }}
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $db }}
  DATABASE_URL: {{ .Values.global.database.url | quote }}
  {{- end }}
  {{- if $oidc }}
  OIDC_CLIENT_SECRET: {{ .Values.global.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
