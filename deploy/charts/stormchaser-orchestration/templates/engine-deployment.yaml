apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stormchaser-orchestration.fullname" . }}-engine
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
{{- $rwoCache := and .Values.engine.persistence.enabled (eq .Values.engine.persistence.accessMode "ReadWriteOnce") }}
{{- if and $rwoCache (gt (int .Values.engine.replicaCount) 1) }}
{{- fail "engine.replicaCount above 1 needs a git cache every replica can mount: set engine.persistence.accessMode to ReadWriteMany, or engine.persistence.enabled to false for a cache per pod" }}
{{- end }}
spec:
  replicas: {{ .Values.engine.replicaCount }}
  {{- if $rwoCache }}
  # The old pod lets go of the cache volume before the new one mounts it, which a pod
  # on another node could not do while the old one held it. Events wait in the stream.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "stormchaser-orchestration.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "stormchaser-orchestration.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
    spec:
      # It never talks to the Kubernetes API (IRSA projects its own token)
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The one place migrations are applied. The API and the engine wait at start-up
      # until the schema is current (STORMCHASER_SCHEMA_WAIT, 5 minutes by default).
      initContainers:
        - name: migrate
          image: "{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          command: ["/usr/local/bin/stormchaser-engine", "migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "stormchaser-orchestration.databaseUrlEnv" . | nindent 12 }}
            - name: STORMCHASER_DB_SSL
              value: {{ .Values.global.database.ssl | quote }}
            - name: RUST_LOG
              value: "info"
            {{- if .Values.global.tls.enabled }}
            - name: TLS_CA_CERT_PATH
              value: {{ .Values.global.tls.caCertPath | quote }}
            - name: TLS_CERT_PATH
              value: {{ .Values.global.tls.certPath | quote }}
            - name: TLS_KEY_PATH
              value: {{ .Values.global.tls.keyPath | quote }}
            {{- end }}
          {{- if .Values.global.tls.enabled }}
          volumeMounts:
            - name: certs
              mountPath: /etc/stormchaser/certs
              readOnly: true
          {{- end }}
      containers:
        - name: engine
          image: "{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          env:
            - name: BINARY
              value: "stormchaser-engine"
            {{- include "stormchaser-orchestration.databaseUrlEnv" . | nindent 12 }}
            - name: STORMCHASER_DB_SSL
              value: {{ .Values.global.database.ssl | quote }}
            - name: NATS_URL
              value: {{ .Values.global.nats.url | quote }}
            {{- with .Values.global.nats.authSecret }}
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
            {{- with .Values.global.approvalLinks.existingSecret }}
            - name: STORMCHASER_APPROVAL_LINK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.global.approvalLinks.existingSecretKey }}
            {{- end }}
            - name: STORMCHASER_SSRF_ALLOWED_HOSTS
              value: {{ join "," .Values.global.ssrfAllowedHosts | quote }}
            - name: STORMCHASER_AWS_ALLOWED_ROLE_ARNS
              value: {{ join "," .Values.global.aws.allowedRoleArns | quote }}
            - name: STORMCHASER_AWS_ALLOWED_LAMBDA_FUNCTIONS
              value: {{ join "," .Values.global.aws.allowedLambdaFunctions | quote }}
            - name: RUST_LOG
              value: {{ .Values.engine.rustLog | quote }}
            - name: GIT_CACHE_DIR
              value: {{ .Values.engine.gitCacheDir | quote }}
            - name: LOKI_URL
              value: {{ .Values.global.loki.url | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.global.grafana.url | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "stormchaser-engine"
            - name: OPA_URL
              value: {{ .Values.global.opa.url | quote }}
            {{- if .Values.global.tls.enabled }}
            - name: TLS_CA_CERT_PATH
              value: {{ .Values.global.tls.caCertPath | quote }}
            - name: TLS_CERT_PATH
              value: {{ .Values.global.tls.certPath | quote }}
            - name: TLS_KEY_PATH
              value: {{ .Values.global.tls.keyPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: git-cache
              mountPath: {{ .Values.engine.gitCacheDir }}
            {{- if .Values.global.tls.enabled }}
            - name: certs
              mountPath: /etc/stormchaser/certs
              readOnly: true
            {{- end }}
        {{- include "stormchaser-orchestration.opaSidecar" . | nindent 8 }}
      volumes:
        {{- include "stormchaser-orchestration.opaPolicyVolume" . | nindent 8 }}
        - name: git-cache
          {{- if .Values.engine.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "stormchaser-orchestration.fullname" . }}-engine-git-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.global.tls.enabled }}
        - name: certs
          secret:
            secretName: {{ .Values.global.tls.existingSecret }}
        {{- end }}
