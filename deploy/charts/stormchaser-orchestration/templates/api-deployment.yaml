apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stormchaser-orchestration.fullname" . }}-api
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "stormchaser-orchestration.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "stormchaser-orchestration.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: BINARY
              value: "stormchaser-api"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              {{- if .Values.global.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.existingSecret }}
                  key: {{ .Values.global.database.existingSecretKey }}
              {{- else }}
              value: {{ .Values.global.database.url | quote }}
              {{- end }}
            - name: STORMCHASER_DB_SSL
              value: {{ .Values.global.database.ssl | quote }}
            - name: NATS_URL
              value: {{ .Values.global.nats.url | quote }}
            - name: RUST_LOG
              value: {{ .Values.api.rustLog | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.global.oidc.issuer | quote }}
            {{- if .Values.global.oidc.externalIssuer }}
            - name: OIDC_EXTERNAL_ISSUER
              value: {{ .Values.global.oidc.externalIssuer | quote }}
            {{- end }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.global.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.global.oidc.clientSecret | quote }}
            - name: LOKI_URL
              value: {{ .Values.global.loki.url | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.global.grafana.url | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "stormchaser-api"
            - name: OPA_URL
              value: {{ .Values.global.opa.url | quote }}
            - name: API_RATE_LIMIT_PER_SECOND
              value: {{ .Values.api.rateLimitPerSecond | quote }}
            - name: API_RATE_LIMIT_BURST_SIZE
              value: {{ .Values.api.rateLimitBurstSize | quote }}
            {{- if .Values.global.tls.enabled }}
            - name: TLS_CA_CERT_PATH
              value: {{ .Values.global.tls.caCertPath | quote }}
            - name: TLS_CERT_PATH
              value: {{ .Values.global.tls.certPath | quote }}
            - name: TLS_KEY_PATH
              value: {{ .Values.global.tls.keyPath | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.global.tls.enabled }}
            - name: certs
              mountPath: /etc/stormchaser/certs
              readOnly: true
            {{- end }}
        {{- if .Values.api.opa.sidecar.enabled }}
        - name: opa
          image: "{{ .Values.api.opa.sidecar.image.repository }}:{{ .Values.api.opa.sidecar.image.tag }}"
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "/config/policy.rego"
          ports:
            - name: http-opa
              containerPort: 8181
              protocol: TCP
          volumeMounts:
            - name: opa-policy
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.api.opa.sidecar.resources | nindent 12 }}
        {{- end }}
      {{- if or .Values.global.tls.enabled .Values.api.opa.sidecar.enabled }}
      volumes:
        {{- if .Values.global.tls.enabled }}
        - name: certs
          secret:
            secretName: {{ .Values.global.tls.existingSecret }}
        {{- end }}
        {{- if .Values.api.opa.sidecar.enabled }}
        - name: opa-policy
          configMap:
            name: {{ include "stormchaser-orchestration.fullname" . }}-opa-policy
        {{- end }}
      {{- end }}
