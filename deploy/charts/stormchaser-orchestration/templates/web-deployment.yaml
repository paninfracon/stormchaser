apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stormchaser-orchestration.fullname" . }}-web
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "stormchaser-orchestration.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "stormchaser-orchestration.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: API_URL
              value: "{{ include "stormchaser-orchestration.internalScheme" . }}://{{ include "stormchaser-orchestration.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: QUERY_URL
              value: "{{ include "stormchaser-orchestration.internalScheme" . }}://{{ include "stormchaser-orchestration.fullname" . }}-query:{{ .Values.query.service.port }}"
            - name: EXTERNAL_API_URL
              value: {{ .Values.web.externalApiUrl | quote }}
            - name: WEB_URL
              value: {{ .Values.web.webUrl | quote }}
            - name: RUST_LOG
              value: {{ .Values.web.rustLog | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.global.grafana.url | quote }}
            - name: STORMCHASER_LISTEN_TLS
              value: {{ include "stormchaser-orchestration.listenTls" . | quote }}
            {{- if eq (include "stormchaser-orchestration.listenTls" .) "true" }}
            # The web tier's own certificate, and the CA that signed the API's and the
            # query service's
            - name: TLS_CA_CERT_PATH
              value: {{ .Values.global.tls.caCertPath | quote }}
            - name: TLS_CERT_PATH
              value: {{ .Values.global.tls.certPath | quote }}
            - name: TLS_KEY_PATH
              value: {{ .Values.global.tls.keyPath | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if eq (include "stormchaser-orchestration.listenTls" .) "true" }}
          volumeMounts:
            - name: certs
              mountPath: /etc/stormchaser/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.global.tls.existingSecret }}
          {{- end }}
