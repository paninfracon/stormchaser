apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stormchaser-orchestration.fullname" . }}-web
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "stormchaser-orchestration.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "stormchaser-orchestration.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: API_URL
              value: "http://{{ include "stormchaser-orchestration.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: QUERY_URL
              value: "http://{{ include "stormchaser-orchestration.fullname" . }}-query:{{ .Values.query.service.port }}"
            - name: EXTERNAL_API_URL
              value: {{ .Values.web.externalApiUrl | quote }}
            - name: WEB_URL
              value: {{ .Values.web.webUrl | quote }}
            - name: RUST_LOG
              value: {{ .Values.web.rustLog | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.global.grafana.url | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
