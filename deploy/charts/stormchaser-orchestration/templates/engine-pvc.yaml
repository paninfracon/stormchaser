{{- if .Values.engine.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stormchaser-orchestration.fullname" . }}-engine-git-cache
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  accessModes:
    - {{ .Values.engine.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.engine.persistence.size | quote }}
  {{- if .Values.engine.persistence.storageClass }}
  storageClassName: {{ .Values.engine.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
