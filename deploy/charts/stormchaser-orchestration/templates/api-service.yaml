apiVersion: v1
kind: Service
metadata:
  name: {{ include "stormchaser-orchestration.fullname" . }}-api
  labels:
    {{- include "stormchaser-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 8181
      targetPort: http-opa
      protocol: TCP
      name: http-opa
  selector:
    {{- include "stormchaser-orchestration.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
