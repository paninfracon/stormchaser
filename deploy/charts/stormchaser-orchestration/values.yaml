# Default values for stormchaser-orchestration.

global:
  image:
    repository: stormchaser
    pullPolicy: IfNotPresent
    tag: "latest"
  database:
    url: "postgres://stormchaser:stormchaser@postgres:5432/stormchaser"
    existingSecret: ""
    existingSecretKey: "DATABASE_URL"
    ssl: true
  nats:
    url: "nats://nats:4222"
    # Name of a Secret with `user` and `password` keys for NATS authentication.
    # Leave empty only if the NATS server accepts unauthenticated clients.
    # The engine uses this one.
    authSecret: ""
    # Secrets of the same shape for the API and the query service, which should have
    # NATS users of their own with far narrower permissions than the engine's (see
    # docs/nats.md). Left empty, each falls back to authSecret.
    apiAuthSecret: ""
    queryAuthSecret: ""
  # Approval emails can carry links that approve or reject a step without logging in.
  # They are sealed with a key of their own, given to both the engine and the API.
  # Leave existingSecret empty to send no links.
  approvalLinks:
    # Name of a Secret holding the key (at least 32 characters).
    existingSecret: ""
    existingSecretKey: "approval-link-key"
  # Internal hosts that workflow-driven HTTP requests (RestApi, WebhookInvoke, api
  # queries, Slack/Teams, WASM downloads) may reach. Requests to private, loopback,
  # link-local and metadata addresses are refused unless the host is listed here.
  # Entries are hostnames, IP literals, or "*.suffix".
  ssrfAllowedHosts: []
  aws:
    # Role ARNs the engine and query service may assume when a workflow, query or
    # S3 connection names one. A trailing "*" matches a prefix. Empty refuses all.
    allowedRoleArns: []
    # Lambda function names or ARNs the engine may invoke with its own credentials
    # (a LambdaInvoke step with no assume_role_arn). A trailing "*" matches a prefix.
    allowedLambdaFunctions: []
  loki:
    url: "http://loki:3100"
  grafana:
    url: "http://grafana:80"
  opa:
    url: "http://127.0.0.1:8181/v1/data/stormchaser/allow"
  oidc:
    issuer: "http://dex:5556/dex"
    externalIssuer: ""
    clientId: "stormchaser-cli"
    # The client secret the API uses to exchange login codes. There is no default:
    # name a Secret (preferred) or set clientSecret, or browser login is unavailable.
    existingSecret: ""
    existingSecretKey: "client-secret"
    clientSecret: ""
  otel:
    endpoint: "http://alloy:4317"
  tls:
    enabled: true
    caCertPath: "/etc/stormchaser/certs/ca.crt"
    certPath: "/etc/stormchaser/certs/tls.crt"
    keyPath: "/etc/stormchaser/certs/tls.key"
    existingSecret: "stormchaser-tls-certs"

api:
  image:
    repository: stormchaser-api
    pullPolicy: IfNotPresent
    tag: "latest"
  replicaCount: 1
  rustLog: "stormchaser_api=info"
  # Each client gets a bucket of rateLimitBurstSize requests that refills at
  # rateLimitPerSecond.
  rateLimitPerSecond: 5
  rateLimitBurstSize: 10
  # Addresses or CIDR ranges of the ingress or load balancer in front of the API.
  # Only requests arriving from these have X-Forwarded-For believed; without them
  # every client behind the proxy shares one rate-limit bucket.
  trustedProxies: []
  # Comma-separated Host header values the MCP server accepts in addition to
  # loopback names and the API_BASE_URL host, e.g. "stormchaser.example.com".
  mcpAllowedHosts: ""
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: stormchaser.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  resources: {}
  opa:
    sidecar:
      enabled: true
      image:
        repository: openpolicyagent/opa
        tag: 0.62.1
      resources: {}
      # Settings read by the shipped policy (files/opa/policy.rego, a link to
      # deploy/opa/policy.rego so that there is one copy).
      settings:
        # Emails or subject ids that may act on any object.
        admins: []
        # Values of the token's `groups` claim that make a user an admin.
        adminGroups: []
        # When true, whoever started a run may not approve its steps.
        separationOfDuties: false
        # Values of the token's `groups` claim whose members may write workflows.
        # Empty means everyone may. When set, everyone else can only run workflows
        # from repositories that an author or admin has registered as a connection:
        # they may not start direct runs, hydrate a form from pasted workflow text,
        # or create or change connections.
        authorGroups: []
      # Replaces the shipped policy when set. It must define `stormchaser.allow` and
      # answer the request, resource, engine and approval questions described in
      # docs/opa-rbac.md.
      policy: ""

query:
  image:
    repository: stormchaser-query
    pullPolicy: IfNotPresent
    tag: "latest"
  replicaCount: 1
  rustLog: "stormchaser_query=info"
  service:
    type: ClusterIP
    port: 3001
  resources: {}
  # Optional: path to a compiled OPA WASM policy bundle mounted in the container.
  # When set, the query service uses the local WASM policy instead of an HTTP OPA server.
  # Leave empty to disable OPA enforcement on this service.
  opaWasmPath: ""

web:
  image:
    repository: stormchaser-web
    pullPolicy: IfNotPresent
    tag: "latest"
  replicaCount: 1
  rustLog: "stormchaser_web=info"
  externalApiUrl: "http://localhost:3000"
  webUrl: "http://localhost:3003"
  service:
    type: ClusterIP
    port: 3003
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: stormchaser.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  resources: {}

engine:
  image:
    repository: stormchaser-engine
    pullPolicy: IfNotPresent
    tag: "latest"
  replicaCount: 1
  rustLog: "stormchaser_engine=info"
  gitCacheDir: "/tmp/stormchaser/git-cache"
  resources: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

prometheus:
  enabled: false
  server:
    persistentVolume:
      enabled: false

grafana:
  enabled: false
  persistence:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: false
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server:80
          isDefault: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: false
