# Default values for stormchaser-orchestration.

global:
  # Not used by this chart's templates; each service has its own image below.
  image:
    repository: stormchaser
    pullPolicy: IfNotPresent
    # Empty means the release this chart belongs to (v<appVersion>)
    tag: ""
  database:
    # postgres://<user>:<password>@<host>:5432/<database>. Better, name a Secret holding
    # it in existingSecret. A URL given here is kept in a Secret the chart creates.
    url: ""
    existingSecret: ""
    existingSecretKey: "DATABASE_URL"
    # STORMCHASER_DB_SSL for the API, engine and query service. true: verified TLS
    # (verify-full) whatever the URL says. false: the sslmode in the URL, or no TLS.
    # Each service opens at most 10 connections (STORMCHASER_DB_MAX_CONNECTIONS); the
    # chart has no value for that.
    ssl: true
  nats:
    url: "nats://nats:4222"
    # Name of a Secret with `user` and `password` keys for NATS authentication.
    # Leave empty only if the NATS server accepts unauthenticated clients.
    # The engine uses this one.
    authSecret: ""
    # Secrets of the same shape for the API and the query service, which should have
    # NATS users of their own with far narrower permissions than the engine's (see
    # docs/nats.md). Left empty, each falls back to authSecret.
    apiAuthSecret: ""
    queryAuthSecret: ""
  # The key the API signs its own session tokens with (STORMCHASER_JWT_SECRET). Without
  # it no one can log in. Name a Secret holding at least 32 random characters; the
  # umbrella chart creates `stormchaser-jwt`.
  jwt:
    existingSecret: ""
    existingSecretKey: "jwt-secret"
  # Approval emails can carry links that approve or reject a step without logging in.
  # They are sealed with a key of their own, given to both the engine and the API.
  # Leave existingSecret empty to send no links.
  approvalLinks:
    # Name of a Secret holding the key (at least 32 characters).
    existingSecret: ""
    existingSecretKey: "approval-link-key"
  # Internal hosts that workflow-driven HTTP requests (RestApi, WebhookInvoke, api
  # queries, Slack/Teams, WASM downloads) may reach. Requests to private, loopback,
  # link-local and metadata addresses are refused unless the host is listed here.
  # Entries are hostnames, IP literals, or "*.suffix".
  ssrfAllowedHosts: []
  aws:
    # Role ARNs the engine and query service may assume when a workflow, query or
    # S3 connection names one. A trailing "*" matches a prefix. Empty refuses all.
    allowedRoleArns: []
    # Lambda function names or ARNs the engine may invoke with its own credentials
    # (a LambdaInvoke step with no assume_role_arn). A trailing "*" matches a prefix.
    allowedLambdaFunctions: []
  # Where the API and engine read step logs from (LOKI_URL). Without a reachable Loki
  # the API cannot show step logs and the engine cannot extract outputs from them.
  # The default is the bundled quickstart Loki; in production point it at your own.
  loki:
    url: "http://loki:3100"
  # GRAFANA_URL. Only the web tier uses it, to link to dashboards.
  grafana:
    url: "http://grafana:80"
  # The OPA decision URL for the API, engine and query service (OPA_URL). The default
  # is the OPA sidecar that api.opa.sidecar.enabled adds to each of those pods; with
  # the sidecar off, point it at an OPA they can reach.
  opa:
    url: "http://127.0.0.1:8181/v1/data/stormchaser/allow"
  oidc:
    issuer: "http://dex:5556/dex"
    externalIssuer: ""
    clientId: "stormchaser-cli"
    # Scopes to ask for at login besides openid, profile, email and offline_access.
    # Policy's admin_groups, author_groups and group approvers need the user's groups
    # in the ID token; Dex sends them only for the `groups` scope. Leave empty for a
    # provider that refuses scopes it does not know.
    extraScopes: []
    # The client secret the API uses to exchange login codes. There is no default:
    # name a Secret (preferred) or set clientSecret, or browser login is unavailable.
    existingSecret: ""
    existingSecretKey: "client-secret"
    clientSecret: ""
  # OTLP gRPC endpoint for traces and metrics (OTEL_EXPORTER_OTLP_ENDPOINT), given to
  # the API, engine and query service; only the API and engine export anything.
  # The default is the bundled quickstart Alloy. See docs/observability.md.
  otel:
    endpoint: "http://alloy:4317"
  tls:
    enabled: true
    caCertPath: "/etc/stormchaser/certs/ca.crt"
    certPath: "/etc/stormchaser/certs/tls.crt"
    keyPath: "/etc/stormchaser/certs/tls.key"
    existingSecret: "stormchaser-tls-certs"
    # The API, the query service and the web tier serve HTTPS themselves with the
    # certificate above, and the web tier calls the other two over HTTPS, trusting the
    # CA above. The certificate must name the three Services
    # (<release>-stormchaser-orchestration-api, -query and -web, or whatever the
    # chart's fullname gives); the umbrella chart generates one that does.
    # An ingress in front must talk HTTPS to its backend: the chart sets
    # nginx.ingress.kubernetes.io/backend-protocol: HTTPS on its own Ingresses; other
    # controllers need their equivalent.
    # Set to false only where a mesh or the network itself protects pod traffic.
    listen: true

# The API, query service, web tier and engine run as an unprivileged user with no
# capabilities. fsGroup makes the engine's git cache volume writable by that user,
# including one an earlier release filled as root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

api:
  image:
    repository: stormchaser-api
    pullPolicy: IfNotPresent
    # Empty means the release this chart belongs to (v<appVersion>)
    tag: ""
  replicaCount: 1
  rustLog: "stormchaser_api=info"
  # Cron workflows: `kubernetes` creates a CronJob per schedule in the release's
  # namespace, which calls the API's trigger URL; `none` only stores the schedule and
  # shows its token once, for a scheduler of your own.
  cron:
    engine: kubernetes
  # The API's ServiceAccount. With the kubernetes cron engine it is given a Role that
  # allows creating and deleting CronJobs and creating Secrets, in this namespace only.
  serviceAccount:
    create: true
    name: ""
  # Serve Swagger UI and the OpenAPI document, without authentication, at
  # /swagger-ui and /api-docs/openapi.json. The page loads Swagger UI from cdnjs
  # (pinned, integrity-checked), so the browser needs to reach it.
  docs: false
  # Each client gets a bucket of rateLimitBurstSize requests that refills at
  # rateLimitPerSecond.
  rateLimitPerSecond: 5
  rateLimitBurstSize: 10
  # Addresses or CIDR ranges of the ingress or load balancer in front of the API.
  # Only requests arriving from these have X-Forwarded-For believed; without them
  # every client behind the proxy shares one rate-limit bucket.
  trustedProxies: []
  # Comma-separated Host header values the MCP server accepts in addition to
  # loopback names and the API_BASE_URL host, e.g. "stormchaser.example.com".
  # The chart does not set API_BASE_URL, so the MCP server's tool calls go to
  # http://localhost:3000. See docs/mcp-server.md.
  mcpAllowedHosts: ""
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: stormchaser.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  resources: {}
  opa:
    sidecar:
      enabled: true
      image:
        repository: openpolicyagent/opa
        tag: 0.62.1
      resources: {}
      # Settings read by the shipped policy (files/opa/policy.rego, a link to
      # deploy/opa/policy.rego so that there is one copy).
      settings:
        # Emails or subject ids that may act on any object.
        admins: []
        # Values of the token's `groups` claim that make a user an admin.
        adminGroups: []
        # When true, whoever started a run may not approve its steps.
        separationOfDuties: false
        # Values of the token's `groups` claim whose members may write workflows.
        # Empty means everyone may. When set, everyone else can only run workflows
        # from repositories that an author or admin has registered as a connection:
        # they may not start direct runs, hydrate a form from pasted workflow text,
        # or create or change connections.
        authorGroups: []
      # Replaces the shipped policy when set. It must define `stormchaser.allow` and
      # answer the request, resource, engine and approval questions described in
      # docs/opa-rbac.md.
      policy: ""

query:
  image:
    repository: stormchaser-query
    pullPolicy: IfNotPresent
    # Empty means the release this chart belongs to (v<appVersion>)
    tag: ""
  replicaCount: 1
  rustLog: "stormchaser_query=info"
  service:
    type: ClusterIP
    port: 3001
  resources: {}
  # Optional: path to a compiled OPA WASM policy bundle mounted in the container.
  # When set, the query service uses the local WASM policy instead of an HTTP OPA server.
  # Leave empty to disable OPA enforcement on this service.
  opaWasmPath: ""

web:
  image:
    repository: stormchaser-web
    pullPolicy: IfNotPresent
    # Empty means the release this chart belongs to (v<appVersion>)
    tag: ""
  replicaCount: 1
  externalApiUrl: "http://localhost:3000"
  webUrl: "http://localhost:3003"
  service:
    type: ClusterIP
    port: 3003
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: stormchaser.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  resources: {}

engine:
  image:
    repository: stormchaser-engine
    pullPolicy: IfNotPresent
    # Empty means the release this chart belongs to (v<appVersion>)
    tag: ""
  # Above 1 with persistence on and accessMode ReadWriteOnce, the chart refuses to
  # render. One replica at a time runs the background workers (timeouts, sweeps).
  replicaCount: 1
  rustLog: "stormchaser_engine=info"
  # Where the engine keeps cloned repositories (GIT_CACHE_DIR); the cache volume is
  # mounted here.
  gitCacheDir: "/tmp/stormchaser/git-cache"
  resources: {}
  # The chart has no values for the run quota ceilings (STORMCHASER_RUN_MAX_*), the
  # Terraform image (STORMCHASER_TERRAFORM_IMAGE) or the database pool size; the
  # engine uses their defaults (see docs/quotas.md).
  # The engine's cache of cloned repositories, kept across restarts. With
  # ReadWriteOnce the Deployment uses the Recreate strategy (the old pod stops
  # before the new one starts) and the chart refuses more than one replica; more
  # replicas need ReadWriteMany, or persistence off for an emptyDir cache per pod.
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Bundled Prometheus and Grafana subcharts, for evaluation only. Production brings
# its own (see docs/observability.md).
prometheus:
  enabled: false
  server:
    persistentVolume:
      enabled: false

grafana:
  enabled: false
  persistence:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: false
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server:80
          isDefault: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: false
