apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "stormchaser-runner-docker.fullname" . }}
  labels:
    {{- include "stormchaser-runner-docker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "stormchaser-runner-docker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stormchaser-runner-docker.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BINARY
              value: "stormchaser-runner-docker"
            - name: NATS_URL
              value: {{ .Values.config.natsUrl | quote }}
            {{- with .Values.config.natsAuthSecret }}
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
            {{- with .Values.config.stateEncryptionSecret }}
            - name: STORMCHASER_STATE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.config.stateEncryptionSecretKey }}
            {{- end }}
            - name: STORMCHASER_STEP_DEFAULT_CPU
              value: {{ .Values.config.stepLimits.defaultCpu | quote }}
            - name: STORMCHASER_STEP_DEFAULT_MEMORY
              value: {{ .Values.config.stepLimits.defaultMemory | quote }}
            - name: STORMCHASER_STEP_MAX_CPU
              value: {{ .Values.config.stepLimits.maxCpu | quote }}
            - name: STORMCHASER_STEP_MAX_MEMORY
              value: {{ .Values.config.stepLimits.maxMemory | quote }}
            - name: STORMCHASER_STEP_DEFAULT_TIMEOUT
              value: {{ .Values.config.stepLimits.defaultTimeout | quote }}
            - name: STORMCHASER_STEP_MAX_TIMEOUT
              value: {{ .Values.config.stepLimits.maxTimeout | quote }}
            - name: STORMCHASER_STEP_PIDS_LIMIT
              value: {{ .Values.config.stepLimits.pidsLimit | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: STORMCHASER_ALLOW_PRIVILEGED
              value: {{ .Values.config.allowPrivileged | quote }}
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: {{ .Values.dockerSocketPath }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
