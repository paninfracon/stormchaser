apiVersion: v2
name: stormchaser
description: A Helm chart for deploying the complete Stormchaser stack
type: application
version: 1.4.2
appVersion: "1.4.2"
dependencies:
  - name: stormchaser-orchestration
    version: ">=1.4.2"
    repository: file://../stormchaser-orchestration
  - name: stormchaser-runner-k8s
    version: ">=1.4.2"
    repository: file://../stormchaser-runner-k8s
  - name: postgresql
    version: 15.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: nats
    version: 1.x.x
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  - name: minio
    version: 14.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: stormchaser-telemetry
    version: ">=1.4.2"
    repository: file://../stormchaser-telemetry
    condition: stormchaser-telemetry.enabled
  - name: loki
    version: "5.43.x"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: tempo
    version: "1.10.x"
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
