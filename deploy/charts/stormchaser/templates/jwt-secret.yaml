{{- /*
The key the API signs its own session tokens with. Generated on first install and kept
across upgrades, so that tokens already issued stay valid.
*/ -}}
{{- if .Values.jwtSecret.generate }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "stormchaser-jwt" }}
apiVersion: v1
kind: Secret
metadata:
  name: stormchaser-jwt
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "jwt-secret") }}
  jwt-secret: {{ index $existing.data "jwt-secret" }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
