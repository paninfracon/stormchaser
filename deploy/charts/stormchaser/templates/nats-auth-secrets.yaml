{{- /*
Credentials for the bundled NATS server. Passwords are generated on first install and
kept across upgrades. The control-plane and runner users are separate so that a runner
credential cannot do what the control plane can (see docs/nats.md).
*/ -}}
{{- if and .Values.nats.enabled .Values.natsAuth.generate }}
{{- range $name, $user := dict "stormchaser-nats-control" "stormchaser" "stormchaser-nats-runner" "stormchaser-runner" }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  user: {{ $user | b64enc }}
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
