{{- /*
Credentials for the bundled NATS server. Passwords are generated on first install and
kept across upgrades. The engine, the API, the query service and the runners each have a
user of their own, so that no one of them can do what another can (see docs/nats.md).
*/ -}}
{{- if and .Values.nats.enabled .Values.natsAuth.generate }}
{{- range $name, $user := dict "stormchaser-nats-control" "stormchaser" "stormchaser-nats-api" "stormchaser-api" "stormchaser-nats-query" "stormchaser-query" "stormchaser-nats-runner" "stormchaser-runner" }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  user: {{ $user | b64enc }}
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  {{- /* NATS reads it as an unquoted config value, which must start with a letter */}}
  password: {{ printf "n%s" (randAlphaNum 31) | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
