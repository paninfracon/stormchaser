{{- /*
The bundled PostgreSQL's passwords, and the DATABASE_URL the services connect with.
Generated on first install and kept across upgrades: PostgreSQL only takes its
passwords when it initialises its data, so a password that changed later would lock the
services out of a database that keeps its data.

It has the name the PostgreSQL chart gives its own Secret. An install from before this
chart generated it keeps the passwords that Secret already holds, and the PostgreSQL
chart's check on upgrade, which looks its passwords up there, finds them.
*/ -}}
{{- if and .Values.postgresql.enabled .Values.postgresqlAuth.generate }}
{{- $name := printf "%s-postgresql" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 32 }}
{{- $adminPassword := randAlphaNum 32 }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- $adminPassword = index $existing.data "postgres-password" | default "" | b64dec | default (randAlphaNum 32) }}
{{- end }}
{{- $auth := .Values.postgresql.auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc }}
  postgres-password: {{ $adminPassword | b64enc }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" $auth.username (urlquery $password) .Release.Name $auth.database | b64enc }}
{{- end }}
