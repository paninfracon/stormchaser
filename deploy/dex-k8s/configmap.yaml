apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: stormchaser
data:
  config.yaml: |
    issuer: http://localhost:5556/dex
    storage:
      type: postgres
      config:
        host: stormchaser-postgresql.stormchaser.svc.cluster.local
        port: 5432
        database: stormchaser
        user: stormchaser
        password: stormchaserpassword
        ssl:
          mode: disable
    web:
      http: 0.0.0.0:5556
    enablePasswordDB: true
    telemetry:
      http: 0.0.0.0:5558
    staticClients:
      - id: stormchaser-cli
        redirectURIs:
          - 'http://localhost:8080/callback'
          - 'http://127.0.0.1:8080/callback'
        name: 'Stormchaser CLI'
        secret: stormchaser-cli-secret
        public: false
    staticPasswords:
      - email: "stormchaser-admin@paninfracon.net"
        hash: "PASSWORD_HASH_PLACEHOLDER"
        username: "admin"
        userID: "08a8684b-db88-4b73-90a9-3dd1661f5466"
