apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: stormchaser
data:
  config.yaml: |
    issuer: http://localhost:5556/dex
    storage:
      type: postgres
      config:
        host: stormchaser-postgresql.stormchaser.svc.cluster.local
        port: 5432
        database: stormchaser
        user: stormchaser
        # Supply the password via the STORMCHASER_DB_PASSWORD environment variable,
        # which should be injected from a Kubernetes Secret (e.g. secretKeyRef).
        password: $STORMCHASER_DB_PASSWORD
        ssl:
          mode: disable
    web:
      http: 0.0.0.0:5556
    enablePasswordDB: true
    telemetry:
      http: 0.0.0.0:5558
    staticClients:
      - id: stormchaser-cli
        redirectURIs:
          - 'http://localhost:8080/callback'
          - 'http://127.0.0.1:8080/callback'
        name: 'Stormchaser CLI'
        secret: stormchaser-cli-secret
        public: false
    staticPasswords:
      - email: "stormchaser-admin@paninfracon.net"
        hash: "PASSWORD_HASH_ADMIN"
        username: "admin"
        userID: "08a8684b-db88-4b73-90a9-3dd1661f5466"
        groups: ["admin"]
      - email: "stormchaser-dev@paninfracon.net"
        hash: "PASSWORD_HASH_DEV"
        username: "developer"
        userID: "18a8684b-db88-4b73-90a9-3dd1661f5466"
        groups: ["developer"]
      - email: "stormchaser-ops@paninfracon.net"
        hash: "PASSWORD_HASH_OPS"
        username: "operator"
        userID: "28a8684b-db88-4b73-90a9-3dd1661f5466"
        groups: ["operator"]
      - email: "stormchaser-sec@paninfracon.net"
        hash: "PASSWORD_HASH_SEC"
        username: "security"
        userID: "38a8684b-db88-4b73-90a9-3dd1661f5466"
        groups: ["security"]
